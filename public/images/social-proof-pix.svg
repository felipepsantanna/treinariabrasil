<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380">
  <defs>
    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean White Card -->
  <rect x="8" y="8" width="524" height="364" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Top bar with Pill Badge -->
  <rect x="36" y="36" width="120" height="32" rx="16" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
  <circle cx="52" cy="52" r="5" fill="#059669" />
  <text x="100" y="57" fill="#047857" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Pix Recebido</text>
  <text x="495" y="57" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" text-anchor="end">Hoje às 11:42</text>

  <!-- Value display -->
  <text x="36" y="116" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500">Valor transferido para sua conta:</text>
  <text x="36" y="172" fill="#0F172A" font-family="'Outfit', sans-serif" font-size="52" font-weight="800">R$ 1.840,00</text>
  <text x="36" y="206" fill="#059669" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Equivalente a US$ 320,00 (Tarefas semanais aprovadas)</text>

  <!-- Divider -->
  <line x1="36" y1="234" x2="495" y2="234" stroke="#F1F5F9" stroke-width="1.5" />

  <!-- Platform info -->
  <rect x="36" y="256" width="44" height="44" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="58" y="284" fill="#059669" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" text-anchor="middle">H</text>

  <text x="92" y="274" fill="#1E293B" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Origem: Hub.xyz Remittance</text>
  <text x="92" y="294" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">Status: Concluído instantaneamente via chave Pix</text>

  <!-- Placeholder Note -->
  <rect x="36" y="322" width="459" height="30" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="265" y="342" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" text-anchor="middle">PLACEHOLDER: Substitua por print real de comprovante Pix ou extrato bancário</text>
</svg>
